---
- name: Synchronize Doom Emacs
  ansible.builtin.command: ~/.emacs.d/bin/doom sync
  register: emacs_doom_output
  when: test_run is undefined
  changed_when:
    - '"No packages need to be installed" not in emacs_doom_output.stdout'
    - '"No packages need rebuilding" not in emacs_doom_output.stdout'
